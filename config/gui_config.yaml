host: "127.0.0.1"
port: 8080
reload: false
# Canonical Stage 10 runtime settings. Nested legacy settings below remain for
# compatibility with the existing ROS monitor and process managers.
refresh_rate: 5.0
status_timeout:
  ready_sec: 1.0
  disconnected_sec: 3.0
rviz_config: "config/embedded_robot_only.rviz"
log_directory: "logs"
robot_mode: "REAL ROBOT"
enable_editable_nodes: false
enable_real_driver_start: true
enable_real_execution: false
real_execution:
  require_ros_health_ready: true
  # When real execution is explicitly enabled for one GUI process, clicking
  # Approve on that exact trajectory is its final arm confirmation.
  arm_approve_is_confirmation: true
  arm_confirmation_phrase: "EXECUTE"
  gripper_confirmation_phrase: "YES"
mode: "REAL ROBOT"
ros_status: "MOCK"
gui_mode: "ROS"
agent_bridge:
  display_name: "Milo"
  mode: "existing_openai"  # existing_scripted, existing_openai, or mock
  timeout_sec: 15
  execution_mode: "plan_only"
  conversation:
    enabled: true
    # Used only for weather questions. Change this to the operator's city.
    weather_location: "Berlin, Germany"
    weather_timeout_sec: 3.0
runtime_backends:
  # "mock" is deterministic and intended for short demonstrations.
  # Set perception_mode to "ros" only after D435i/SAM3 ROS health is 2READY;
  # set grasp_mode to "graspgenx" only after the GUI-managed server is running.
  # A requested live backend never falls back to fabricated mock observations.
  perception_mode: "mock"  # mock | ros
  grasp_mode: "mock"       # mock | graspgenx
  mock_perception:
    object_id: "mock_red_cube_1"
    confidence: 0.99
phase9:
  # Real-mode planning and RViz preview are available. Physical execution is
  # governed separately by the top-level enable_real_execution safety gate.
  simulation_only: false
  place_named_target: "safe_home"
  mock_verification_success: true
  target_review:
    always_when_multiple: true
    ambiguity_margin: 0.10
  grasp_review:
    require_review: true
ros_monitor:
  refresh_hz: 5
  ready_age_sec: 1.0
  warning_age_sec: 3.0
  joint_state_topic: "/joint_states"
  rgb_topic: "/camera/camera/color/image_raw"
  depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
  gripper_state_topic: "/gripper_state"
  move_group_node: "move_group"
  planning_scene_service: "/get_planning_scene"
rviz:
  executable: "rviz2"
  config_path: "config/embedded_robot_only.rviz"
embedded_rviz:
  enabled: true
  display: ":99"
  screen_resolution: "2560x1440x24"
  vnc_host: "127.0.0.1"
  vnc_port: 5901
  novnc_host: "127.0.0.1"
  novnc_port: 6080
  novnc_web_root: "/usr/share/novnc"
  iframe_url: "http://127.0.0.1:6080/vnc.html?autoconnect=true&resize=scale&host=127.0.0.1&port=6080"
  rviz_config: "config/embedded_robot_only.rviz"
  software_rendering: true
  auto_start: false
simulation_motion:
  # Used only while the GUI runs in SIMULATION mode. These values determine
  # MoveIt's trajectory timing, so RViz previews and fake-hardware execution
  # move at the same speed. Real-robot limits are intentionally unaffected.
  velocity_scale: 0.30
  acceleration_scale: 0.30
system_launcher:
  ros_domain_id: 27
  workspace_path: "/home/lenard/dev_ws"
  # Linux parent-death signal: if the GUI process disappears unexpectedly,
  # each GUI-owned launcher receives SIGINT and shuts down its ROS children.
  parent_death_signal: "SIGINT"
  components:
    camera:
      type: ros2_launch
      display_name: "Camera"
      package: realsense2_camera
      launch_file: rs_launch.py
      arguments: ["enable_rgbd:=true", "enable_sync:=true", "align_depth.enable:=true", "enable_color:=true", "enable_depth:=true", "pointcloud.enable:=true", "pointcloud.allow_no_texture_points:=true"]
      conflict_node_names: ["/camera/camera"]
      timeout_sec: 15
    ur5_fake:
      type: ros2_launch
      display_name: "UR5 Fake Hardware"
      package: ur5_launcher
      launch_file: ur5_complete.launch.py
      arguments: ["robot_ip:=192.168.10.27", "use_fake_hardware:=true", "activate_joint_controller:=true", "start_camera_node:=false", "use_nominal_camera_extrinsics:=true", "launch_rviz:=false"]
      conflict_node_names: ["/move_group"]
      timeout_sec: 20
    ur5_real:
      type: ros2_launch
      display_name: "UR5 Real Hardware"
      package: ur5_launcher
      launch_file: ur5_complete.launch.py
      arguments: ["robot_ip:=192.168.10.27", "use_fake_hardware:=false", "activate_joint_controller:=true", "start_camera_node:=false", "use_nominal_camera_extrinsics:=true", "launch_rviz:=false"]
      conflict_node_names: ["/move_group"]
      requires_confirmation: true
      timeout_sec: 20
    gripper:
      type: ros2_launch
      display_name: "Gripper"
      package: robotiq_gripper_communication
      launch_file: ros_gripper_comm.launch.py
      arguments: []
      timeout_sec: 10
    graspgenx:
      type: external_process
      display_name: "GraspGenX Server"
      conda_environment: graspgenx
      working_directory: "/home/lenard/GraspGenX/GraspGenX"
      executable: python
      arguments: ["client-server/graspgenx_server.py", "--config", "/home/lenard/GraspGenX/GraspGenX/ext/graspgenx_checkpoints/release", "--assets_dir", "/home/lenard/GraspGenX/GraspGenX/assets", "--default_gripper", "robotiq_2f_140", "--port", "5556"]
      timeout_sec: 15
